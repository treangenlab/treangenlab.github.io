# Tools shown on the Code page, one block per tool, grouped by main programming language.
# name, repo (owner/name), host (github, gitlab, or web with a url), language, description,
# themes (any of: biosecurity, pathogen, microbiome, algorithms), leads (profile file names, or plain names
# for people without a profile), page (file name of the tool's page in _projects, if it has one),
# demo: the terminal animation. Each step has a command (cmd), then either run: true (shows the tool working)
#   or out: lines of output. Commands follow each tool's README. real_output: true means the output lines
#   are copied from example files in the tool's repository; otherwise they list the documented output files.
- name: onsight
  repo: treangenlab/onsight
  host: github
  language: C
  description: Pathogen detection directly from nanopore raw signal, on CPU, during the run.
  themes:
  - pathogen
  - biosecurity
  - algorithms
  leads:
  - ehuang
  demo:
  - cmd: onsight --pore r10 --panel-dir example/panel -o example_out/ -t 4 example/reads.pod5
    run: true
  - cmd: grep neighbor_check example_out/target_calls.tsv | cut -f1-4
    out:
    - "Staphylococcus aureus\tread_pvalue+neighbor_check\t1\t4"
    - "Enterococcus faecalis\tread_pvalue+neighbor_check\t1\t9"
  real_output: false
  page: onsight
- name: Gingr2
  repo: marbl/gingr
  host: github
  language: C++
  description: Interactive viewer for genome alignments and phylogenetic trees, part of the Harvest suite.
  themes:
  - algorithms
  - pathogen
  leads:
  - mnute
  demo:
  - cmd: parsnp -r examples/mers_virus/ref/England1.fna -d examples/mers_virus/genomes/*.fna -o examples-out
    run: true
  - cmd: gingr examples-out/parsnp.ggr
    out:
    - (Gingr opens the alignment, variants and tree in a window)
  real_output: false
  video: gingr-demo.mp4
  video_poster: gingr-demo-poster.jpg
  video_alt: 'Screen recording of Gingr: a phylogenetic tree beside the Parsnp core-genome alignment of 47 MERS-CoV genomes, zooming from the whole genome down to single bases and back.'
  video_caption: Screen recording of Gingr on Parsnp's core-genome alignment of 47 MERS-CoV genomes (parsnp.ggr from the Harvest documentation), zooming from the whole genome to single bases.
  note: The repository card and the recording show the original Gingr.
- name: KOMB
  repo: treangenlab/komb
  host: github
  language: C++
  description: K-core based characterization of copy number variation in microbiomes, straight from reads.
  themes:
  - microbiome
  - algorithms
  leads:
  - abalaji
  demo:
  - cmd: python KOMB.py -i example_data/reads1.fastq -j example_data/reads2.fastq -k 51
    run: true
  real_output: false
  page: komb
- name: Mash
  repo: marbl/mash
  host: github
  language: C++
  description: Fast genome and metagenome distance estimation using MinHash.
  themes:
  - algorithms
  - microbiome
  - pathogen
  leads:
  - Brian Ondov
  - Todd Treangen
  demo:
  - cmd: mash sketch -o genomes genome1.fna genome2.fna genome3.fna
    run: true
  - cmd: mash screen genomes.msh reads1.fastq reads2.fastq > screen.tab
    run: true
  - cmd: cut -f1-5 screen.tab
    out:
    - "0.861792\t44/1000\t1\t5.00742e-229\tgenome1.fna"
    - "0.853596\t36/1000\t1\t1.7048e-184\tgenome2.fna"
    - "0.861792\t44/1000\t1\t5.00742e-229\tgenome3.fna"
  real_output: true
- name: Parsnp2
  repo: marbl/parsnp
  host: github
  language: C++
  description: Rapid core-genome alignment and SNP detection for thousands of microbial genomes.
  themes:
  - pathogen
  - algorithms
  leads:
  - bkille
  demo:
  - cmd: parsnp -r examples/mers_virus/ref/England1.fna -d examples/mers_virus/genomes/*.fna -o examples-out
    run: true
  - cmd: ls examples-out
    out:
    - parsnp.ggr  parsnp.snps.mblocks  parsnp.tree  parsnp.xmfa
  real_output: false
  page: parsnp
- name: Seqwin
  repo: treangenlab/seqwin
  host: github
  language: C++
  description: Ultrafast identification of signature sequences in microbial genomes.
  themes:
  - pathogen
  - biosecurity
  - algorithms
  leads:
  - xwang
  demo:
  - cmd: seqwin --tar-paths targets.txt --neg-paths non-targets.txt
    out:
    - INFO | Running Seqwin v0.5.0
    - INFO | Loaded 72 target assemblies and 99 non-target assemblies, 171 in total.
    - INFO | Building minimizer graph from 171 assemblies...
    - INFO |  - Found 8346500 minimizers
    - INFO |  - Found 469602 nodes (unique minimizers)
  - cmd: head -4 seqwin-out/signatures.csv | cut -d, -f1,2
    out:
    - fasta_header,length
    - 0-VXJV01000007.1-292041:292440,399
    - 0-VXJV01000007.1-45226:45439,213
    - 0-VXJV01000015.1-52097:52442,345
  real_output: true
  page: seqwin
- name: SeqScreen
  repo: treangenlab/seqscreen
  host: gitlab
  language: Nextflow
  description: Functional screening of pathogenic sequences via ensemble learning.
  themes:
  - biosecurity
  - pathogen
  - microbiome
  - algorithms
  leads:
  - rdoughty
  - fquinanta
  - abalaji
  - bkille
  demo:
  - cmd: seqscreen --fasta input.fasta --databases /path/to/seqscreen_databases/ --working output_directory
    run: true
  - cmd: head -3 output_directory/report_generation/*report.tsv | cut -f1,11,13,15
    out:
    - "#query\tsize\torganism\tgene_name"
    - "Oct29_142\t504\tDickeya dadantii\thypothetical protein"
    - "Oct29_199\t296\tTomato golden mosaic virus-Yellow vein\tReplication-associated protein"
  real_output: true
  page: seqscreen
  note: SeqScreen is hosted on GitLab; SeqScreen2 is coming to GitHub.
- name: somatem
  repo: treangenlab/somatem
  host: github
  language: Nextflow
  description: A modular, open-source Nextflow toolkit for long-read microbiome analysis.
  themes:
  - microbiome
  leads:
  - pkalvapalle
  demo:
  - cmd: somatem examples --outdir somatem-examples
    run: true
  - cmd: somatem 16S --outdir results
    run: true
  real_output: false
  page: somatem
- name: Crykey
  repo: treangenlab/crykey
  host: github
  language: Python
  description: Cryptic lineage detection for SARS-CoV-2 wastewater surveillance.
  themes:
  - pathogen
  - algorithms
  leads:
  - yliu
  demo:
  - cmd: python crykey_wastewater.py -i demo/test_metadata.tsv -r demo/SARS-CoV-2-reference.fasta -d crykey_dbs -o crykey_output
    run: true
  - cmd: python crykey_query.py -d crykey_dbs -o crykey_output
    run: true
  - cmd: head -3 crykey_output/final_result.csv | cut -d, -f1-6
    out:
    - Date,Site,Nt Mutations,AA Mutations,Support DP,Total DP
    - 1012023,Test,C6402T;G6456A,ORF1a:P2046L;ORF1a:C2064Y,7,60
    - 1012023,Test,C27131T;T27176C,M:N203N;M:A218A,13,289
  real_output: true
  page: crykey
- name: Emu
  repo: treangenlab/emu
  host: github
  language: Python
  description: Species-level microbial community profiling for full-length 16S reads.
  themes:
  - microbiome
  - algorithms
  leads:
  - kcurry
  demo:
  - cmd: emu abundance example/full_length.fa
    run: true
  - cmd: ls results
    out:
    - full_length_rel-abundance.tsv
  real_output: false
  page: emu
- name: Harvest
  repo: marbl/harvest
  host: github
  language: Python
  description: A suite of core-genome alignment and visualization tools (Parsnp, Gingr, HarvestTools) for thousands of microbial genomes.
  themes:
  - algorithms
  - pathogen
  leads:
  - Todd Treangen
  - Brian Ondov
  demo:
  - cmd: parsnp -r ref.fna -d genomes/ -o out
    run: true
  - cmd: gingr out/parsnp.ggr
    out:
    - (opens the alignment and tree in Gingr)
  real_output: false
- name: Kente
  repo: treangenlab/Kente
  host: github
  language: Python
  description: A graph-based pangenomic approach for horizontal gene transfer detection in microbiomes.
  themes:
  - microbiome
  - algorithms
  leads:
  - nkokroko
  demo:
  - cmd: ./kente_kraken2.sh contigs/ out/ /path/to/kraken2_database 16
    run: true
  - cmd: ./kente_minigraph_alignment.sh contigs/ out/ /path/to/pangenome_graphs 16 4
    run: true
  - cmd: python3 Kente_extract_genusblocks.py --gaf_dir out/gaf_by_genus --out results/sample_genus_blocks.tsv --win 500
    run: true
  - cmd: ls results
    out:
    - sample_genus_blocks.tsv
  real_output: false
  page: kente
- name: Lemur
  repo: treangenlab/lemur
  host: github
  language: Python
  description: Lightweight taxonomic profiling of long-read metagenomic datasets.
  themes:
  - microbiome
  - algorithms
  leads:
  - nsapoval
  demo:
  - cmd: lemur -i examples/example-data/example.fastq -o example-output -d examples/example-db --tax-path examples/example-db/taxnomy.tsv -r species
    run: true
  - cmd: cut -f1,2,9 example-output/relative_abundance-species.tsv
    out:
    - "species\tgenus\tF"
    - "Listeria monocytogenes\tListeria\t1.0"
  real_output: true
  page: lemur_magnet
- name: MAGnet
  repo: treangenlab/magnet
  host: github
  language: Python
  description: Reference-based refinement of taxonomic profiles, with presence and absence calls for each genome.
  themes:
  - microbiome
  leads:
  - nsapoval
  - yliu
  demo:
  - cmd: magnet -c lemur_report.tsv -i reads.fastq -o magnet_out -m ont
    run: true
  - cmd: ls magnet_out
    out:
    - cluster_representative.tsv
  real_output: false
  page: lemur_magnet
- name: MetAMOS
  repo: marbl/metamos
  host: github
  language: Python
  description: A modular framework for metagenomic assembly, analysis and validation.
  themes:
  - microbiome
  - algorithms
  leads:
  - Todd Treangen
  - Sergey Koren
  demo:
  - cmd: initPipeline -f -m carsonella_pe_filt.fna -d test1 -i 500:3500
    run: true
  - cmd: runPipeline -a soap -c kraken -g fraggenescan -p 15 -d test1 -k 55
    run: true
  real_output: false
- name: MethPhaser
  repo: treangenlab/methphaser
  host: github
  language: Python
  description: Methylation-based long-read haplotype phasing of human genomes.
  themes:
  - algorithms
  leads:
  - yfu
  demo:
  - cmd: meth_phaser_parallel -b test_data/HLA.R10.haplotagged.bam -r test_data/GRCh38.chr6.fna -g test_data/LSK.filtered.gtf -vc test_data/HLA.R10.phased.vcf.gz -o test_data/work
    run: true
  - cmd: meth_phaser_post_processing -ib test_data/HLA.R10.haplotagged.bam -if test_data/work/ -ov test_data/output.vcf -ob test_data/output -vc test_data/HLA.R10.phased.vcf.gz
    run: true
  real_output: false
  page: methphaser
- name: Mimic
  repo: treangenlab/Mimic
  host: github
  language: Python
  description: A metagenome simulator that creates nanopore reads mirroring an existing microbial community.
  themes:
  - microbiome
  - algorithms
  leads:
  - rdoughty
  - ymthant
  demo:
  - cmd: python mimic.py -i sample.fastq -o output -r 100000 --db lemur_db -t 8
    run: true
  - cmd: ls output/lemur output/magnet
    out:
    - 'output/lemur:'
    - relative_abundance.tsv
    - ''
    - 'output/magnet:'
    - cluster_representative.tsv
  real_output: false
- name: Olivar
  repo: treangenlab/olivar
  host: github
  language: Python
  description: Automated variant-aware primer design for multiplex tiled amplicon sequencing.
  themes:
  - pathogen
  - algorithms
  leads:
  - xwang
  demo:
  - cmd: olivar build -f example_input/EPI_ISL_402124.fasta -v example_input/delta_omicron_loc.csv -d example_input/Human/GRCh38_primary -o example_output -p 1
    run: true
  - cmd: olivar tiling example_output/EPI_ISL_402124.olvr -o example_output --max-amp-len 420 --min-amp-len 252 --check-var --seed 10 -p 1
    run: true
  - cmd: head -3 example_output/olivar-design.primer.bed
    out:
    - "EPI_ISL_402124\t99\t117\tEPI_ISL_402124_1_LEFT_1\t1\t+\tCGGCTGCATGCTTAGTGC"
    - "EPI_ISL_402124\t288\t309\tEPI_ISL_402124_2_LEFT_1\t2\t+\tCAACGAGAAAACACACGTCCA"
    - "EPI_ISL_402124\t360\t379\tEPI_ISL_402124_1_RIGHT_1\t1\t-\tGACCTCCTCCACGGAGTCT"
  real_output: true
  page: olivar
- name: Olivia
  repo: treangenlab/Olivia
  host: github
