- name: Olivar
  repo: treangenlab/olivar
  host: github
  language: Python
  description: Automated variant-aware primer design for multiplex tiled amplicon sequencing.
  themes:
  - pathogen
  - algorithms
  leads:
  - xwang
  demo:
