  - git clone https://github.com/treangenlab/bronko.git && cd bronko
  diy_note: The test data is in the repository.
- name: mft-tools
  repo: treangenlab/mft-tools
  host: github
  language: Rust
  description: 'The Min-Frame Transformation: a sequence transformation that masks point mutations for more sensitive viral genome alignment.'
  themes:
  - pathogen
  - algorithms
  leads:
  - rdoughty
  demo:
  - cmd: mft define-order -k 3 -s 42 -o order_seed42.txt
    run: true
  - cmd: mft transform -g England1.fna -k 3 -w 5 -m mapping_tables/k3_XX-.txt -b order_seed42.txt -o genome_mft.fasta
    run: true
  - cmd: sed -n 2p England1.fna | cut -c 1-60
    out:
    - ATTTAAGTGAATAGCTTGGCTATCTCACTTCCCCTCGTTCTCTTGCAGAACTTTGATTTT
  - cmd: grep -v '>' genome_mft.fasta | head -c 60
    out:
    - PPAAAOPPPAHHAPPPFHHHDIIIOAAAPKFIIIAAAIIAPJJJJPAAAAPPPOAAPPAA
  real_output: true
  page: mft
  diy:
  - mamba create -n mft-tools -c conda-forge -c bioconda mft-tools && mamba activate mft-tools
  - git clone https://github.com/treangenlab/mft-tools.git && cd mft-tools
  diy_note: England1.fna stands for any genome in FASTA format; the mapping tables are in the repository.
