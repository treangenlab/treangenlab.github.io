# Badges shown at the bottom of profile pages. A profile lists the ones it has under `badges:` in its front matter,
# e.g. `badges: [rse, dog, runner]`. The PhD badge is added automatically for anyone with `phd_alum: true`.
# Each badge: label (shown under the medal), icon (a Font Awesome solid icon name, without "fa-")
# or image (a white SVG drawing in assets/img/badges, for icons Font Awesome lacks),
# colors (two colors for the medal's gradient), about (shown when the pointer rests on the badge).
# Badges are shown in the order they appear in this file.

