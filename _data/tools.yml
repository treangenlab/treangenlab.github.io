- name: Strainify
  repo: treangenlab/strainify
  host: github
  language: Python
  description: Strain-level microbiome profiling for low-coverage short-read metagenomic datasets.
  themes:
  - microbiome
  - algorithms
  leads:
  - rluo
  demo:
  - cmd: ./strainify --genome_folder example/genomes --fastq_folder example/fastqs/single --read_type single --outdir example/results
    run: true
  - cmd: cat example/results/abundance_estimates_combined.csv
    out:
    - strain name,10x_ratio_2
    - E24377A,23.7987
    - H10407,24.8376
    - Sakai,24.9406
    - UTI89,26.423
  real_output: true
  page: strainify
- name: bronko
  repo: treangenlab/bronko
  host: github
  language: Rust
  description: Ultrafast, alignment-free detection of viral genome variation.
  themes:
  - pathogen
  - algorithms
  leads:
  - rdoughty
  demo:
  - cmd: bronko call -d test_data/hpv.bkdb -1 test_data/rep1_R1.fastq.gz -2 test_data/rep1_R2.fastq.gz -o out
    run: true
  - cmd: grep -v '^##' out/rep1_R1.vcf | cut -f 1,2,4,5,8 | cut -d';' -f1-2
    out:
    - '#CHROM    POS   REF  ALT  INFO'
    - HPV16REF  4192  T    G    DP=94710;AF=0.494
    - HPV16REF  4196  G    T    DP=94831;AF=0.497
    - HPV16REF  4784  T    A    DP=24072;AF=0.014
  - cmd: cut -f 2-4,7,8 out/bronko_overview.tsv
    out:
    - selected_genome  num_major_snp  num_minor_snp  breadth_coverage  depth_coverage
    - HPV16            0              3              0.9947            34288.2668
  real_output: true
  page: bronko
- name: mft-tools
  repo: treangenlab/mft-tools
  host: github
  language: Rust
  description: 'The Min-Frame Transformation: a sequence transformation that masks point mutations for more sensitive viral genome alignment.'
  themes:
  - pathogen
  - algorithms
  leads:
  - rdoughty
  demo:
  - cmd: mft define-mapping -k 5 -s 11011 -o mapping_tables/k5_11011.txt
    run: true
  - cmd: mft define-order -k 3 -s 42 -o order_seed42.txt
    run: true
  real_output: false
  page: mft
- name: QuaID
  repo: treangenlab/quaid
  host: gitlab
  language: Python
  description: Earlier detection of recently emerged SARS-CoV-2 variants of concern in wastewater, using quasi-unique mutations.
  themes:
  - pathogen
  - algorithms
  leads:
  - nsapoval
  demo:
  - cmd: ./run_analyses.sh TST08082022
    run: true
  - cmd: python quaid.py MSA_precomputed/vdb_lineage_df_week.csv MSA_precomputed/metadata.tsv ./Variant-calling-combined ./Coverage --concat-output --occurence-cutoff 2 --inclusion-cutoff 0.5 --exclusion-cutoff 0.5 --time-window 4 --level 4
    run: true
  - cmd: head -1 output/*.csv
    out:
    - Date,Plant,Total AF,Total QU count,# QU possible,Fraction covered,WHO name
  real_output: false
- name: Omi
  host: web
  url: https://omi.rice.edu/
  language: Web app
  description: 'A metagenomics co-pilot: ask about assembly graphs, taxonomic profiling, quality control, tool parameters, pipeline configuration and your own metagenomic results.'
  themes:
  - microbiome
  - algorithms
  leads:
  - dongwei
  note: Built by the Treangen Lab and RushLab at Rice.
