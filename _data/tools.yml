# Tools shown on the Code page, one block per tool, grouped by main programming language.
# name, repo (owner/name), host (github, gitlab, or web with a url), language, description,
# themes (any of: biosecurity, pathogen, microbiome, algorithms), leads (profile file names, or plain names
# for people without a profile), page (file name of the tool's page in _projects, if it has one),
# demo: the terminal animation. Each step has a command (cmd), then either run: true (shows the tool working)
#   or out: lines of output. Commands follow each tool's README. real_output: true means the output lines
#   come from running the tool here or from example files in its repository; otherwise they list documented files.
# Optional picture or clip under the terminal: image (in assets/img) or video (in assets/video) with video_poster
#   (in assets/img), each with _w, _h, _alt and _caption.
# diy: the set-up commands shown in DIY mode (install, get the example data); diy_note: one line on what else is needed.
- name: onsight
  repo: treangenlab/onsight
  host: github
  language: C
  description: Pathogen detection directly from nanopore raw signal, on CPU, during the run.
  themes:
  - pathogen
  - biosecurity
  - algorithms
  leads:
  - ehuang
  demo:
  - cmd: onsight --pore r10 --panel-dir example/panel -o example_out/ -t 4 example/reads.pod5
    run: true
  - cmd: cut -f 1,2,6,7 example_out/target_calls.tsv | grep -e entry -e neighbor_check
    out:
    - entry        rule                        called  first_call_reads
    - S. aureus    read_pvalue+neighbor_check  1       4
    - E. faecalis  read_pvalue+neighbor_check  1       9
  real_output: true
  page: onsight
  video: onsight-demo.mp4
  video_poster: onsight-demo-poster.jpg
  video_w: 1000
  video_h: 460
  video_alt: 'Animation of onsight on its example data: raw nanopore signal arrives read by read, and the two panel targets, S. aureus and E. faecalis, are marked present at reads 4 and 9.'
  video_caption: 'Drawn from a run of onsight on its example data (160 simulated reads, two-target panel): the signal traces are the reads'' raw signal and the calls are the ones onsight wrote. The full 24-target panel covers the ESKAPE pathogens.'
  diy:
  - git clone https://github.com/treangenlab/onsight.git && cd onsight
  - conda env create -f environment.yml && conda activate onsight
  - make -j 8 && make install
  diy_note: The example reads and panel are in the repository.
- name: Gingr2
  repo: marbl/gingr
  host: github
  language: C++
  description: Interactive viewer for genome alignments and phylogenetic trees, part of the Harvest suite.
  themes:
  - algorithms
  - pathogen
  leads:
  - mnute
  demo:
  - cmd: parsnp -r examples/mers_virus/ref/England1.fna -d examples/mers_virus/genomes/*.fna -o examples-out
    run: true
  - cmd: gingr examples-out/parsnp.ggr
    out:
    - (Gingr opens the alignment, variants and tree in a window)
  real_output: true
  video: gingr-demo.mp4
  video_poster: gingr-demo-poster.jpg
  video_alt: 'Screen recording of Gingr: a phylogenetic tree beside the Parsnp core-genome alignment of 47 MERS-CoV genomes, zooming from the whole genome down to single bases and back.'
  video_caption: Screen recording of Gingr on Parsnp's core-genome alignment of 47 MERS-CoV genomes (parsnp.ggr from the Harvest documentation), zooming from the whole genome to single bases.
  note: The repository card and the recording show the original Gingr.
  video_w: 1000
  video_h: 640
  diy:
  - conda install -c bioconda parsnp
  - git clone https://github.com/marbl/parsnp.git && cd parsnp
  diy_note: Gingr is a desktop application; get it from the Gingr repository. The example genomes are in the Parsnp repository.
- name: KOMB
  repo: treangenlab/komb
  host: github
  language: C++
  description: K-core based characterization of copy number variation in microbiomes, straight from reads.
  themes:
  - microbiome
  - algorithms
  leads:
  - abalaji
  demo:
  - cmd: KOMB.py -i reads1.fastq -j reads2.fastq -k 51
    run: true
  - cmd: head -4 output/kcore.tsv
    out:
    - '#VID  Name    Coreness  Degree'
    - 0     43505   2         2
    - 1     104790  3         6
    - 2     157574  3         3
  - cmd: head -3 output/CoreA_anomaly.txt
    out:
    - 0  0.060455
    - 1  0.974224
    - 2  0.178875
  real_output: true
  page: komb
  image: tools/komb-demo.png
  image_w: 1100
  image_h: 506
  image_alt: 'Two plots from a KOMB run. Left: the KOMB profile, the number of unitigs in each k-core shell, with most unitigs in low shells and a few dense shells out to 700. Right: unitig degree against coreness, with 12,261 anomalous unitigs highlighted below the main trend.'
  image_caption: 'From a KOMB run on the first 600,000 read pairs of the Shakya et al. mock community (SRR606249). Left: the KOMB profile. Right: anomalous unitigs, those with a CORE-A score above Q3 + 1.5 IQR.'
  diy:
  - git clone https://github.com/treangenlab/komb.git && cd komb
  diy_note: KOMB is built from source and needs ggcat, bwa-mem2 and igraph; the README has the steps. Use your own paired reads in place of reads1.fastq and reads2.fastq.
- name: Mash
  repo: marbl/mash
  host: github
  language: C++
  description: Fast genome and metagenome distance estimation using MinHash.
  themes:
  - algorithms
  - microbiome
  - pathogen
  leads:
  - Brian Ondov
  - Todd Treangen
  demo:
  - cmd: mash sketch -o genomes genome1.fna genome2.fna genome3.fna
    run: true
  - cmd: mash screen genomes.msh reads1.fastq reads2.fastq > screen.tab
    run: true
  - cmd: cut -f1-5 screen.tab
    out:
    - "0.861792\t44/1000\t1\t5.00742e-229\tgenome1.fna"
    - "0.853596\t36/1000\t1\t1.7048e-184\tgenome2.fna"
    - "0.861792\t44/1000\t1\t5.00742e-229\tgenome3.fna"
  real_output: true
  diy:
  - conda install -c bioconda mash
  - git clone https://github.com/marbl/Mash.git && cd Mash/test
  diy_note: The three genomes and two read files are the test data in the Mash repository.
- name: Parsnp2
  repo: marbl/parsnp
  host: github
  language: C++
  description: Rapid core-genome alignment and SNP detection for thousands of microbial genomes.
  themes:
  - pathogen
  - algorithms
  leads:
  - bkille
  demo:
  - cmd: parsnp -r examples/mers_virus/ref/England1.fna -d examples/mers_virus/genomes/*.fna -o examples-out
    run: true
    out:
    - Aligned 47 genomes in 2.93 seconds
  - cmd: ls examples-out
    out:
    - England1.fna.ref  config  log  parsnp.ggr  parsnp.maf
    - parsnp.snps.mblocks  parsnp.tree  parsnp.xmfa  parsnpAligner.ini
  - cmd: head -c 96 examples-out/parsnp.tree
    out:
    - (((Riyadh_4_2013.fna:0.01917180179598590092,(Riyadh_3_2013.fna:0.03704946230388730249,(Wadi-Ad-D
  real_output: true
  page: parsnp
  note: 'Open parsnp.ggr in Gingr to browse the alignment and tree: see the Gingr2 recording.'
  image: tools/parsnp-tree.png
  image_w: 1100
  image_h: 946
  image_alt: Phylogenetic tree of 47 MERS-CoV genomes from Parsnp, with the Al-Hasa 2013 genomes forming one tight cluster and camel-derived genomes another.
  image_caption: The tree Parsnp wrote for its MERS-CoV example (parsnp.tree), drawn with Biopython.
  diy:
  - conda install -c bioconda parsnp
  - git clone https://github.com/marbl/parsnp.git && cd parsnp
  diy_note: The example genomes are in the repository.
- name: Seqwin
  repo: treangenlab/seqwin
  host: github
  language: C++
  description: Ultrafast identification of signature sequences in microbial genomes.
  themes:
  - pathogen
  - biosecurity
  - algorithms
  leads:
  - xwang
  demo:
  - cmd: seqwin --tar-paths targets.txt --neg-paths non-targets.txt
    out:
    - INFO | Running Seqwin v0.5.0
    - INFO | Loaded 72 target assemblies and 99 non-target assemblies, 171 in total.
    - INFO | Building minimizer graph from 171 assemblies...
    - INFO |  - Found 8346500 minimizers
    - INFO |  - Found 469602 nodes (unique minimizers)
  - cmd: head -4 seqwin-out/signatures.csv | cut -d, -f1,2
    out:
    - fasta_header,length
    - 0-VXJV01000007.1-292041:292440,399
    - 0-VXJV01000007.1-45226:45439,213
    - 0-VXJV01000015.1-52097:52442,345
  real_output: true
  page: seqwin
  diy:
  - conda create -n seqwin seqwin --channel conda-forge --channel bioconda --strict-channel-priority
  - conda activate seqwin
  diy_note: targets.txt and non-targets.txt list the paths of your own genome files.
- name: SeqScreen
  repo: treangenlab/seqscreen
  host: gitlab
  language: Nextflow
  description: 'Functional screening of sequences: flags functions of sequences of concern (FunSoCs) in each query, with taxonomy and gene annotation.'
  themes:
  - biosecurity
  - pathogen
  - microbiome
  - algorithms
  leads:
  - rdoughty
  - fquinanta
  - abalaji
  - bkille
  demo:
  - cmd: seqscreen --fasta example_data/test_seqs.fasta --databases /path/to/seqscreen_databases/ --working output_directory
    run: true
  - cmd: grep -e '^#' -e Oct29_255 -e Oct29_194 -e Oct29_142 output_directory/report_generation/seqscreen_report.tsv | cut -f 1,7-10
    out:
    - '#query     evasion  cytotoxicity  degrade_ecm  disable_organ'
    - Oct29_142  0        0             0            0
    - Oct29_255  0        1             0            1
    - Oct29_194  1        0             0            0
  - cmd: ls output_directory/report_generation
    out:
    - seqscreen_html_report.zip  seqscreen_report.tsv
  real_output: true
  page: seqscreen
  note: SeqScreen is hosted on GitLab; SeqScreen2 is coming to GitHub.
  image: tools/seqscreen-html-report.png
  image_w: 1190
  image_h: 385
  image_alt: 'SeqScreen HTML report: a table with one row per query sequence, its organism, gene name and GO terms, and one column per function of concern, with a red 1 where a function is present.'
  image_caption: 'SeqScreen''s HTML report, from the SeqScreen wiki: one row per sequence and one column per FunSoC, with a 1 where the function is present. The report can be sorted and filtered.'
  diy_note: Installing SeqScreen and its databases (hundreds of gigabytes) is described in the <a href="https://gitlab.com/treangenlab/seqscreen/wikis/home">SeqScreen wiki</a>.
- name: somatem
  repo: treangenlab/somatem
  host: github
  language: Nextflow
  description: 'A modular, open-source Nextflow toolkit for long-read microbiome analysis: preprocessing, 16S and metagenomic profiling, assembly and MAG recovery, isolate analysis, pathogen screening and genome dynamics, each with an HTML summary.'
  themes:
  - microbiome
  leads:
  - pkalvapalle
  demo:
  - cmd: somatem examples --outdir somatem-examples
    run: true
  - cmd: somatem 16S --outdir results
    out:
    - '[PROCESS 02/d8c805] ORCHESTRATE_SOMATEM:SOMATEM:PREPROCESSING:RawNanoPlot (mock1)'
    - '[PROCESS 4a/467bf4] ORCHESTRATE_SOMATEM:SOMATEM:PREPROCESSING:CHOPPER (mock1)'
    - '[PROCESS 0d/abcb1e] ORCHESTRATE_SOMATEM:SOMATEM:PREPROCESSING:FinalNanoPlot (mock1)'
    - '[PROCESS 4b/7642d7] ORCHESTRATE_SOMATEM:SOMATEM:TAXONOMIC_PROFILING:EMU_ABUNDANCE (mock1)'
    - '...'
  - cmd: ls results/summary_reports
    out:
    - 16S_summary_report.html  pre_processing_summary_report.html
  real_output: false
  page: somatem
  note: 'Other workflows: pre_processing, taxonomic_profiling, assembly_mags, isolate_analysis, seqscreen and genome_dynamics. Each writes an HTML summary report.'
  diy:
  - micromamba create -n somatem -c bioconda somatem
  - micromamba activate somatem
  diy_note: The first command of the example downloads the example data; the first run of a workflow also downloads its database.
- name: Crykey
  repo: treangenlab/crykey
  host: github
  language: Python
  description: Cryptic lineage detection for SARS-CoV-2 wastewater surveillance.
  themes:
  - pathogen
  - algorithms
  leads:
  - yliu
  demo:
  - cmd: python crykey_wastewater.py -i demo/test_metadata.tsv -r demo/SARS-CoV-2-reference.fasta -d crykey_dbs -o crykey_output
    run: true
  - cmd: python crykey_query.py -d crykey_dbs -o crykey_output
    run: true
  - cmd: head -3 crykey_output/final_result.csv | cut -d, -f1-6
    out:
    - Date,Site,Nt Mutations,AA Mutations,Support DP,Total DP
    - 1012023,Test,C6402T;G6456A,ORF1a:P2046L;ORF1a:C2064Y,7,60
    - 1012023,Test,C27131T;T27176C,M:N203N;M:A218A,13,289
  real_output: true
  page: crykey
  diy:
  - git clone https://github.com/treangenlab/crykey.git && cd crykey
  diy_note: The dependencies are listed in the README; the demo data is in the repository.
- name: Emu
  repo: treangenlab/emu
  host: github
  language: Python
  description: Species-level microbial community profiling for full-length 16S reads.
  themes:
  - microbiome
  - algorithms
  leads:
  - kcurry
  demo:
  - cmd: emu abundance example/full_length.fa
    run: true
  - cmd: cut -f 1-3 results/full_length_rel-abundance.tsv | head -4
    out:
    - tax_id   abundance  species
    - 2420510  0.5        Sphingobacterium puteale
    - 220927   0.25       Mycobacterium saskatchewanense
    - 1310     0.25       Streptococcus sobrinus
  real_output: true
  page: emu
  video: emu-demo.mp4
  video_poster: emu-demo-poster.jpg
  video_w: 1000
  video_h: 560
  video_alt: 'Animation of Emu estimates on the ZymoBIOMICS mock community across its 22 expectation-maximization iterations. Estimates for the 8 species in the sample move onto the ground truth, while species not in the sample fall from 43 to 6 and the L1 error falls from 0.254 to 0.034.'
  video_caption: 'Redrawn from the benchmark data behind the Emu paper (the per-iteration results in treangenlab/emu-benchmark): full-length 16S nanopore reads from the ZymoBIOMICS mock community. Each expectation-maximization iteration moves the estimates toward the ground truth; false positive species drop from 43 to 6 and L1 error from 0.254 to 0.034.'
  diy:
  - conda config --add channels bioconda && conda config --add channels conda-forge
  - conda install emu
  - git clone https://github.com/treangenlab/emu.git && cd emu
  - export EMU_DATABASE_DIR=$PWD/emu_database
  diy_note: The example reads and a default database are in the repository.
- name: Harvest
  repo: marbl/harvest
  host: github
  language: Python
  description: A suite of core-genome alignment and visualization tools (Parsnp, Gingr, HarvestTools) for thousands of microbial genomes.
  themes:
  - algorithms
  - pathogen
  leads:
  - Todd Treangen
  - Brian Ondov
  demo:
  - cmd: parsnp -r examples/mers_virus/ref/England1.fna -d examples/mers_virus/genomes/*.fna -o examples-out
    run: true
    out:
    - Aligned 47 genomes in 2.93 seconds
  - cmd: harvesttools -i examples-out/parsnp.ggr -V variants.vcf
    out:
    - Loading examples-out/parsnp.ggr...
    - Writing variants.vcf...
  - cmd: grep -v '^##' variants.vcf | cut -f 2,4,5,7 | head -4
    out:
    - POS  REF  ALT  FILTER
    - 300  C    T    PASS
    - 340  C    A    PASS
    - 380  C    T    PASS
  - cmd: gingr examples-out/parsnp.ggr
    out:
    - '(opens the alignment and tree in Gingr: see the Gingr2 recording)'
  real_output: true
  diy:
  - conda install -c bioconda parsnp harvesttools
  - git clone https://github.com/marbl/parsnp.git && cd parsnp
  diy_note: Gingr is a desktop application; get it from the Gingr repository.
- name: Kente
  repo: treangenlab/Kente
  host: github
  language: Python
  description: A graph-based pangenomic approach for horizontal gene transfer detection in microbiomes.
  themes:
  - microbiome
  - algorithms
  leads:
  - nkokroko
  demo:
  - cmd: ./kente_kraken2.sh contigs/ out/ /path/to/kraken2_database 16
    run: true
  - cmd: ./kente_minigraph_alignment.sh contigs/ out/ /path/to/pangenome_graphs 16 4
    run: true
  - cmd: python3 Kente_extract_genusblocks.py --gaf_dir out/gaf_by_genus --out results/sample_genus_blocks.tsv --win 500
    run: true
  - cmd: ls results
    out:
    - sample_genus_blocks.tsv
  real_output: false
  page: kente
  diy:
  - git clone https://github.com/treangenlab/Kente.git && cd Kente
  diy_note: Kente needs Kraken2 with a database, minigraph, and the <a href="https://zenodo.org/records/18895175">Kente pangenome graph database</a> (2.5 GB), which comes with example contigs.
- name: Lemur
  repo: treangenlab/lemur
  host: github
  language: Python
  description: Lightweight taxonomic profiling of long-read metagenomic datasets.
  themes:
  - microbiome
  - algorithms
  leads:
  - nsapoval
  demo:
  - cmd: lemur -i examples/example-data/example.fastq -o example-output -d examples/example-db --tax-path examples/example-db/taxonomy.tsv -r species
    run: true
  - cmd: cut -f1,2,9 example-output/relative_abundance-species.tsv
    out:
    - "species\tgenus\tF"
    - "Listeria monocytogenes\tListeria\t1.0"
  real_output: true
  page: lemur_magnet
  diy:
  - conda install -c bioconda lemur
  - git clone https://github.com/treangenlab/lemur.git && cd lemur
  diy_note: The example reads and database are in the repository.
- name: MAGnet
  repo: treangenlab/magnet
  host: github
  language: Python
  description: Reference-based refinement of taxonomic profiles, with presence and absence calls for each genome.
  themes:
  - microbiome
  leads:
  - nsapoval
  - yliu
  demo:
  - cmd: magnet -c lemur_report.tsv -i reads.fastq -o magnet_out -m ont
    run: true
  - cmd: cut -d, -f 10,17,22,23 magnet_out/cluster_representative.csv | grep -e Species -e Listeria -e Pseudomonas -e FMQ74
    out:
    - Species                 Primary Breadth       Combined PS and ANI  Presence/Absence
    - Listeria sp. LM90SB2    1.0                   99.79                Present
    - Pseudomonas aeruginosa  0.9736029157761855    96.34                Present
    - Bacillus sp. FMQ74      0.002592275317516481  10.36                Absent
  real_output: true
  page: lemur_magnet
  diy:
  - git clone https://github.com/treangenlab/magnet.git && cd magnet
  - conda env create -n magnet -f magnet_env.yml && conda activate magnet
  diy_note: Use a Lemur report and your own reads in place of the file names.
- name: MethPhaser
  repo: treangenlab/methphaser
  host: github
  language: Python
  description: Methylation-based long-read haplotype phasing of human genomes.
  themes:
  - algorithms
  leads:
  - yfu
  demo:
  - cmd: meth_phaser_parallel -b test_data/HLA.R10.haplotagged.bam -r test_data/GCA_000001405.15_GRCh38_no_alt_analysis_set.chr6.fna -g test_data/LSK.filtered.gtf -vc test_data/HLA.R10.phased.vcf.gz -o test_data/work
    run: true
  - cmd: cut -d, -f 2,3,6,7,8 test_data/work/chr6/0_3.csv
    out:
    - snp_phased_block_1,snp_phased_block_2,myth_phasing_relationship,same_hap_num,diff_hap_num
    - '"(30927529, 31700433)","(29000000, 30738854)",cannot decide,,'
    - '"(29000000, 30738854)","(30798118, 30854714)",not same,7,140'
    - '"(30798118, 30854714)","(30927529, 31700433)",cannot decide,,'
  - cmd: meth_phaser_post_processing -ib test_data/HLA.R10.haplotagged.bam -if test_data/work/ -ov test_data/output.vcf -ob test_data/output -vc test_data/HLA.R10.phased.vcf.gz
    run: true
  - cmd: ls test_data | grep output
    out:
    - output.chr6.methtagged.bam
    - output.vcf
  real_output: true
  page: methphaser
  diy:
  - mamba install -c bioconda methphaser
  diy_note: Download the <a href="https://zenodo.org/record/8360845">test data</a> (about 335 MB) into a folder named test_data.
- name: Mimic
