- name: bronko
  repo: treangenlab/bronko
  host: github
  language: Rust
  description: Ultrafast, alignment-free detection of viral genome variation.
  themes:
  - pathogen
  - algorithms
  leads:
  - rdoughty
  demo:
  - cmd: bronko call -d test_data/hpv.bkdb -1 test_data/rep1_R1.fastq.gz -2 test_data/rep1_R2.fastq.gz -o out
    run: true
  - cmd: grep -w 4784 out/rep1_R1.vcf | cut -f 1,2,4,5,8 | cut -d';' -f1-2
    out:
    - HPV16REF  4784  T    A    DP=24072;AF=0.014
  - cmd: cut -f 2,7,8 out/bronko_overview.tsv
    out:
    - selected_genome  breadth_coverage  depth_coverage
    - HPV16            0.9947            34288.2668
  real_output: true
  page: bronko
  video: bronko-demo.mp4
  video_poster: bronko-demo-poster.jpg
  video_w: 1000
  video_h: 580
  video_alt: 'IGV screenshots of the HPV16 test reads aligned with minimap2, zooming from the whole genome to position 4,784, where 307 of 26,135 aligned reads (1.2%) carry an A in place of the reference T. bronko reports the same variant at 1.4% without aligning.'
  video_caption: 'Checked against an alignment: the same test reads mapped with minimap2 and viewed in IGV. At position 4,784, 307 of 26,135 reads (1.2%) carry the A that bronko calls at 1.4% (333 of 24,072) from k-mers alone.'
