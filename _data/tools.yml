    run: true
  - cmd: olivar tiling example_output/EPI_ISL_402124.olvr -o example_output --max-amp-len 420 --min-amp-len 252 --check-var --seed 10 -p 1
    run: true
  - cmd: head -3 example_output/olivar-design.primer.bed
    out:
    - "EPI_ISL_402124\t99\t117\tEPI_ISL_402124_1_LEFT_1\t1\t+\tCGGCTGCATGCTTAGTGC"
    - "EPI_ISL_402124\t288\t309\tEPI_ISL_402124_2_LEFT_1\t2\t+\tCAACGAGAAAACACACGTCCA"
    - "EPI_ISL_402124\t360\t379\tEPI_ISL_402124_1_RIGHT_1\t1\t-\tGACCTCCTCCACGGAGTCT"
  real_output: true
  page: olivar
  diy:
  - conda create -n olivar olivar --channel conda-forge --channel bioconda --strict-channel-priority
  - conda activate olivar
  - git clone https://github.com/treangenlab/Olivar.git && cd Olivar
  diy_note: The example input is in the repository. Cloning the example BLAST database (example_input/Human) needs Git LFS.
